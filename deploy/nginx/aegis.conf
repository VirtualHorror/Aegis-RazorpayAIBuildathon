# nginx site for the hosted Aegis instance (Decisions.md D-081).
# Flow: aegis.nabhanyubm.tech → 127.0.0.1:3000 (Next.js) · api.aegis.nabhanyubm.tech → 127.0.0.1:4000 (Fastify).
#       `certbot --nginx` (deploy/setup-server.sh) rewrites this file in place: it adds the 443 listeners with the
#       Let's Encrypt paths and turns the port-80 blocks into redirects. The forwarded headers are what the API
#       trusts through TRUST_PROXY=loopback, so its rate limiter buckets by the real client instead of 127.0.0.1.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name aegis.nabhanyubm.tech;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name api.aegis.nabhanyubm.tech;
    server_tokens off;
    # Fastify's bodyLimit is 1 MiB; refuse bigger deliveries here, before they reach the app.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The dashboard's live feed is one long server-sent-events response: never buffer it, never time it out early.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
